name: ci

on:
  workflow_dispatch:
  push:
    paths: ['platform/ps4/**', 'tools/pswaker/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['platform/ps4/**', 'tools/pswaker/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  diagnostic-host-checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Check maintained diagnostic tools
        run: |
          python3 -m compileall -q platform/ps4 tools/pswaker
          for script in platform/ps4/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s platform/ps4/tests
